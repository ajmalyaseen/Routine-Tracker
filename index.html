<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Routine Tracker</title>
  
  <!-- PWA & iOS Safari Mobile Web App Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Routine Tracker">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2310b981'/><path d='M30 50 L45 65 L75 35' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
            },
            zinc: {
              850: '#1c1c20',
              900: '#141417',
              950: '#09090b',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Supabase Official JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }
    .checkbox-custom:checked + label {
      text-decoration: line-through;
      color: #71717a;
    }
  </style>
</head>
<body class="min-h-screen text-zinc-100 antialiased selection:bg-brand-500 selection:text-white flex flex-col justify-between">

  <!-- TOP APP BAR -->
  <header class="sticky top-0 z-30 w-full border-b border-zinc-800/80 bg-zinc-950/80 backdrop-blur-md px-5 sm:px-8 py-4">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      
      <!-- Logo / Title -->
      <div class="flex items-center space-x-3">
        <div class="h-9 w-9 rounded-xl bg-brand-500/10 border border-brand-500/30 flex items-center justify-center text-brand-400 shadow-sm">
          <i data-lucide="check-circle-2" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-white">Routine Tracker</h1>
          <p id="todayDateLabel" class="text-xs text-zinc-400 font-medium">Loading date...</p>
        </div>
      </div>

      <!-- Right Actions: Cloud Status & Reset -->
      <div class="flex items-center gap-3">
        <!-- Supabase Cloud Sync Badge -->
        <div id="cloudBadge" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-zinc-900 border border-zinc-800 text-zinc-300">
          <span id="cloudDot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="cloudText" class="hidden sm:inline">Synced</span>
        </div>

        <!-- Add Routine Button -->
        <button onclick="toggleAddForm()" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-semibold shadow-md transition active:scale-95">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Add Routine</span>
        </button>

        <!-- Menu / Clear -->
        <div class="relative group">
          <button class="p-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-white border border-zinc-800 transition">
            <i data-lucide="more-horizontal" class="w-4 h-4"></i>
          </button>
          <div class="absolute right-0 mt-2 w-48 py-2 bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl opacity-0 group-hover:opacity-100 pointer-events-none group-hover:pointer-events-auto transition duration-150 z-50">
            <button onclick="resetDayTicks()" class="w-full text-left px-4 py-2 text-xs text-amber-400 hover:bg-zinc-800 flex items-center gap-2">
              <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reset Today's Ticks
            </button>
            <button onclick="clearAllRoutines()" class="w-full text-left px-4 py-2 text-xs text-rose-400 hover:bg-zinc-800 flex items-center gap-2">
              <i data-lucide="trash-2" class="w-4 h-4"></i> Delete All Routines
            </button>
          </div>
        </div>

      </div>

    </div>
  </header>

  <!-- MAIN VIEWPORT -->
  <main class="max-w-3xl mx-auto w-full px-5 sm:px-8 py-6 space-y-6 flex-1">

    <!-- MINIMAL PROGRESS CARD -->
    <div class="p-5 rounded-2xl bg-zinc-900/60 border border-zinc-800/80 backdrop-blur space-y-3">
      <div class="flex items-center justify-between text-xs">
        <span class="font-semibold text-zinc-300">Today's Progress</span>
        <div class="flex items-center gap-2 font-mono">
          <span id="progressRatio" class="text-zinc-400">0 of 0 done</span>
          <span id="progressPercent" class="font-bold text-brand-400">0%</span>
        </div>
      </div>
      <!-- Progress Bar -->
      <div class="w-full h-2 bg-zinc-800 rounded-full overflow-hidden">
        <div id="progressBar" class="h-full bg-brand-500 rounded-full transition-all duration-300 ease-out" style="width: 0%"></div>
      </div>
    </div>

    <!-- CLEAN ADD ROUTINE DRAWER (EXPANDABLE) -->
    <div id="addRoutineForm" class="hidden p-5 rounded-2xl bg-zinc-900 border border-zinc-800 shadow-xl space-y-4 transition duration-200">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-semibold text-white">Add New Routine</h3>
        <button onclick="toggleAddForm()" class="text-zinc-500 hover:text-zinc-300 text-xs">&times; Close</button>
      </div>

      <form onsubmit="handleCreateRoutine(event)" class="space-y-3">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <!-- Time input -->
          <div>
            <label class="block text-[11px] font-medium text-zinc-400 mb-1">Time</label>
            <input type="text" id="inputTime" placeholder="e.g. 07:00 AM" required class="w-full px-3.5 py-2 rounded-xl bg-zinc-950 border border-zinc-800 text-xs text-white placeholder-zinc-600 focus:outline-none focus:border-brand-500 font-mono">
          </div>
          <!-- Category / Tag input -->
          <div>
            <label class="block text-[11px] font-medium text-zinc-400 mb-1">Tag / Category (optional)</label>
            <input type="text" id="inputTag" placeholder="e.g. SQL, ML, Workout" class="w-full px-3.5 py-2 rounded-xl bg-zinc-950 border border-zinc-800 text-xs text-white placeholder-zinc-600 focus:outline-none focus:border-brand-500">
          </div>
          <!-- Submit button -->
          <div class="flex items-end">
            <button type="submit" class="w-full py-2 px-4 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-semibold text-xs transition shadow flex items-center justify-center gap-1">
              <i data-lucide="plus" class="w-4 h-4"></i> Add Routine
            </button>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-medium text-zinc-400 mb-1">Routine Title / Task</label>
          <input type="text" id="inputTitle" placeholder="e.g. Wakeup, hydrate & study SQL Window functions" required class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-brand-500">
        </div>
      </form>
    </div>

    <!-- ROUTINE LIST CONTAINER -->
    <div id="routineList" class="space-y-3">
      <!-- Injected via JavaScript -->
    </div>

    <!-- EMPTY STATE -->
    <div id="emptyState" class="hidden py-16 px-6 text-center border border-dashed border-zinc-800 rounded-3xl space-y-4">
      <div class="w-12 h-12 rounded-2xl bg-zinc-900 border border-zinc-800 text-zinc-500 flex items-center justify-center mx-auto">
        <i data-lucide="calendar" class="w-6 h-6"></i>
      </div>
      <div class="space-y-1">
        <h3 class="text-sm font-semibold text-zinc-200">No routines added yet</h3>
        <p class="text-xs text-zinc-500 max-w-sm mx-auto">
          Add your own custom routine slots above, or tell Claude via MCP to generate your daily AI/ML schedule!
        </p>
      </div>
      <button onclick="toggleAddForm()" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-medium text-zinc-200 transition">
        <i data-lucide="plus" class="w-4 h-4"></i> Add First Routine
      </button>
    </div>

  </main>

  <!-- CLEAN MINIMAL FOOTER -->
  <footer class="py-6 px-5 border-t border-zinc-800/60 text-center text-xs text-zinc-500 max-w-3xl mx-auto w-full">
    <span>Routine Tracker &bull; Synced with Supabase &bull; Connected to Claude MCP</span>
  </footer>

  <!-- SCRIPT -->
  <script>
    // SUPABASE CONFIGURATION
    const SUPABASE_URL = 'https://gwrrlipcjhhrwjjjkuby.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3cnJsaXBjamhocndqamprdWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4MTQ0OTYsImV4cCI6MjExMDM5MDQ5Nn0.B0-Eg4YOMyRe7rQNdOl_-xYtw6G6S9TKdX45KNvngHQ';
    const USER_ID = 'routine-master-user';

    let supabase = null;
    if (window.supabase) {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    // STATE
    let routines = [];
    let todayDate = new Date().toISOString().split('T')[0];

    // AUDIO CONTEXT
    let audioCtx = null;
    function playClickSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(580, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.06);
      } catch (e) {}
    }

    // LOAD & SAVE
    function loadLocal() {
      const saved = localStorage.getItem('user_routines');
      if (saved) {
        try {
          routines = JSON.parse(saved);
        } catch (e) {}
      }
    }

    function saveLocal() {
      localStorage.setItem('user_routines', JSON.stringify(routines));
    }

    // SUPABASE PUSH
    async function pushToSupabase() {
      if (!supabase) return;
      try {
        const { error } = await supabase
          .from('user_discipline_state')
          .upsert({
            user_id: USER_ID,
            state: { date: todayDate, routines: routines },
            updated_at: new Date().toISOString()
          });
        updateCloudStatus(!error);
      } catch (e) {
        updateCloudStatus(false);
      }
    }

    // SUPABASE PULL
    async function pullFromSupabase() {
      if (!supabase) return;
      try {
        const { data, error } = await supabase
          .from('user_discipline_state')
          .select('state')
          .eq('user_id', USER_ID)
          .single();

        if (data && data.state && Array.isArray(data.state.routines)) {
          routines = data.state.routines;
          saveLocal();
          render();
          updateCloudStatus(true);
        }
      } catch (e) {
        updateCloudStatus(false);
      }
    }

    // LISTEN FOR REALTIME CHANGES (e.g. Claude MCP inserts a routine)
    function subscribeToRealtime() {
      if (!supabase) return;
      try {
        supabase
          .channel('public:user_discipline_state')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'user_discipline_state' }, payload => {
            if (payload.new && payload.new.user_id === USER_ID && payload.new.state && payload.new.state.routines) {
              routines = payload.new.state.routines;
              saveLocal();
              render();
            }
          })
          .subscribe();
      } catch (e) {}
    }

    function updateCloudStatus(synced) {
      const dot = document.getElementById('cloudDot');
      const text = document.getElementById('cloudText');
      if (synced) {
        dot.className = "w-2 h-2 rounded-full bg-emerald-400";
        text.innerText = "Synced";
      } else {
        dot.className = "w-2 h-2 rounded-full bg-zinc-500";
        text.innerText = "Offline";
      }
    }

    // RENDER ROUTINES
    function render() {
      const list = document.getElementById('routineList');
      const empty = document.getElementById('emptyState');

      if (!routines || routines.length === 0) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        updateProgress();
        return;
      }

      empty.classList.add('hidden');
      list.innerHTML = routines.map((item, index) => `
        <div class="group flex items-center justify-between p-4 rounded-2xl bg-zinc-900/80 hover:bg-zinc-900 border ${item.done ? 'border-zinc-800/50 bg-zinc-950/40' : 'border-zinc-800'} transition duration-150">
          
          <div class="flex items-center gap-3.5 flex-1 min-w-0 pr-3">
            <!-- Custom Checkbox -->
            <button onclick="toggleRoutine(${index})" class="w-6 h-6 rounded-lg border flex items-center justify-center shrink-0 transition active:scale-90 ${item.done ? 'bg-brand-500 border-brand-500 text-white' : 'border-zinc-700 hover:border-zinc-500 bg-zinc-950'}">
              ${item.done ? '<i data-lucide="check" class="w-4 h-4 stroke-[3]"></i>' : ''}
            </button>

            <!-- Time Pill -->
            <span class="text-xs font-mono font-medium px-2.5 py-1 rounded-md bg-zinc-950 border border-zinc-800/80 text-zinc-400 shrink-0">
              ${item.time}
            </span>

            <!-- Title -->
            <span class="text-sm font-medium truncate select-none ${item.done ? 'text-zinc-500 line-through' : 'text-zinc-100'}">
              ${item.title}
            </span>

            <!-- Optional Tag -->
            ${item.category ? `<span class="hidden sm:inline-block text-[10px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-md bg-zinc-800 text-zinc-400 shrink-0">${item.category}</span>` : ''}
          </div>

          <!-- Actions -->
          <div class="flex items-center gap-1 opacity-80 sm:opacity-0 sm:group-hover:opacity-100 transition">
            <button onclick="deleteRoutine(${index})" class="p-1.5 text-zinc-500 hover:text-rose-400 rounded-lg hover:bg-zinc-800 transition" title="Delete">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>

        </div>
      `).join('');

      lucide.createIcons();
      updateProgress();
    }

    // TOGGLE DONE
    function toggleRoutine(index) {
      if (!routines[index]) return;
      routines[index].done = !routines[index].done;
      if (routines[index].done) playClickSound();
      saveLocal();
      render();
      pushToSupabase();
    }

    // ADD ROUTINE
    function handleCreateRoutine(e) {
      e.preventDefault();
      const time = document.getElementById('inputTime').value.trim();
      const title = document.getElementById('inputTitle').value.trim();
      const tag = document.getElementById('inputTag').value.trim();

      if (!time || !title) return;

      routines.push({
        id: 'rt-' + Date.now(),
        time: time,
        title: title,
        category: tag || '',
        done: false
      });

      // Clear & close
      document.getElementById('inputTime').value = '';
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputTag').value = '';
      toggleAddForm();

      saveLocal();
      render();
      pushToSupabase();
    }

    // DELETE ROUTINE
    function deleteRoutine(index) {
      routines.splice(index, 1);
      saveLocal();
      render();
      pushToSupabase();
    }

    // RESET TICKS FOR TODAY
    function resetDayTicks() {
      if (!confirm("Reset all checkmarks for today?")) return;
      routines.forEach(r => r.done = false);
      saveLocal();
      render();
      pushToSupabase();
    }

    // CLEAR ALL
    function clearAllRoutines() {
      if (!confirm("Delete all routines to start completely fresh?")) return;
      routines = [];
      saveLocal();
      render();
      pushToSupabase();
    }

    // PROGRESS
    let lastPercent = 0;
    function updateProgress() {
      const total = routines.length;
      const done = routines.filter(r => r.done).length;
      const percent = total > 0 ? Math.round((done / total) * 100) : 0;

      document.getElementById('progressRatio').innerText = `${done} of ${total} done`;
      document.getElementById('progressPercent').innerText = `${percent}%`;
      document.getElementById('progressBar').style.width = `${percent}%`;

      if (percent === 100 && lastPercent < 100 && total > 0) {
        confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
      }
      lastPercent = percent;
    }

    function toggleAddForm() {
      const form = document.getElementById('addRoutineForm');
      form.classList.toggle('hidden');
      if (!form.classList.contains('hidden')) {
        document.getElementById('inputTime').focus();
      }
    }

    // INIT
    window.addEventListener('DOMContentLoaded', () => {
      const options = { weekday: 'long', month: 'short', day: 'numeric' };
      document.getElementById('todayDateLabel').innerText = new Date().toLocaleDateString(undefined, options);

      loadLocal();
      render();
      pullFromSupabase();
      subscribeToRealtime();
      lucide.createIcons();
    });

    // PWA SERVICE WORKER
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
